<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mechanical Glass Octopus</title>
<style>
  body { margin: 0; overflow: hidden; background: #050508; font-family: system-ui, -apple-system, sans-serif; }
  #ui {
    position: absolute; top: 14px; left: 14px; color: #f0f0ff; z-index: 10;
    background: rgba(10,10,18,0.82); padding: 14px 16px; border-radius: 12px;
    backdrop-filter: blur(12px); border: 1px solid rgba(120,150,255,0.2);
    min-width: 240px;
  }
  #ui h1 { margin: 0 0 2px 0; font-size: 15px; font-weight: 650; letter-spacing: -0.2px; }
  #ui .sub { margin: 0 0 10px 0; font-size: 11px; opacity: 0.65; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  button {
    background: #2c3dff; color: white; border: none; padding: 6px 11px;
    border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  button:hover { background: #4a5aff; }
  button.active { background: #ff2d55; }
  label { font-size: 11px; opacity: 0.8; display: flex; align-items: center; gap: 6px; }
  input[type="color"] { width: 32px; height: 22px; border: none; background: none; cursor: pointer; padding: 0; }
  #info { font-size: 10px; margin-top: 6px; color: #777; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <h1>Mechanical Glass Octopus</h1>
  <div class="sub">Hyalos GX-style procedural</div>
  <div class="row">
    <button id="btnExplode">Explode</button>
    <button id="btnIris">Open Iris</button>
    <button id="btnDome">Lift Dome</button>
  </div>
  <label>Background <input type="color" id="bgColor" value="#050508"></label>
  <div id="info">Drag to rotate · Scroll to zoom</div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.FogExp2(0x050508, 0.006);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(7.5, 4.2, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);

// Lights
scene.add(new THREE.AmbientLight(0x1a1a28, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(5, 12, 7);
scene.add(key);
const fill = new THREE.DirectionalLight(0x3355aa, 0.45);
fill.position.set(-6, 2, -5);
scene.add(fill);
const rim = new THREE.PointLight(0x77bbff, 2.4, 18);
rim.position.set(0, 1.5, -5);
scene.add(rim);
const coreLight = new THREE.PointLight(0x00ff99, 2.2, 6);
coreLight.position.set(0, 1.7, 0);
scene.add(coreLight);

// Materials
const mDark = new THREE.MeshStandardMaterial({ color: 0x15151c, metalness: 0.94, roughness: 0.22 });
const mMid = new THREE.MeshStandardMaterial({ color: 0x2e2e3a, metalness: 0.9, roughness: 0.28 });
const mLight = new THREE.MeshStandardMaterial({ color: 0x7a7a96, metalness: 0.87, roughness: 0.2 });
const mCopper = new THREE.MeshStandardMaterial({ color: 0xb86a32, metalness: 0.82, roughness: 0.32 });
const mGlass = new THREE.MeshPhysicalMaterial({
  color: 0xb8d4ff, metalness: 0.02, roughness: 0.015,
  transmission: 0.95, thickness: 0.35, ior: 1.52,
  clearcoat: 1, clearcoatRoughness: 0.03, transparent: true, opacity: 0.7
});
const mSucker = new THREE.MeshStandardMaterial({ color: 0xd45566, metalness: 0.1, roughness: 0.5 });
const mGlow = new THREE.MeshStandardMaterial({ color: 0x00ffaa, emissive: 0x00ff88, emissiveIntensity: 1.1 });

const root = new THREE.Group();
scene.add(root);

// Body
const body = new THREE.Group();
root.add(body);

const mantle = new THREE.Mesh(new THREE.SphereGeometry(1.65, 64, 40, 0, Math.PI*2, 0, Math.PI*0.62), mDark);
mantle.position.y = 0.45;
mantle.scale.set(1.08, 1.25, 1.08);
body.add(mantle);

const midRing = new THREE.Mesh(new THREE.TorusGeometry(1.48, 0.09, 16, 56), mMid);
midRing.position.y = -0.15;
midRing.rotation.x = Math.PI/2;
body.add(midRing);

// Teeth
for (let i = 0; i < 42; i++) {
  const a = (i / 42) * Math.PI * 2;
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.08, 0.1), mCopper);
  t.position.set(Math.cos(a)*1.58, -0.15, Math.sin(a)*1.58);
  t.rotation.y = -a;
  body.add(t);
}

// Dome
const dome = new THREE.Mesh(new THREE.SphereGeometry(1.78, 64, 32, 0, Math.PI*2, 0, Math.PI*0.46), mGlass);
dome.position.y = 1.72;
body.add(dome);

// Inner glowing core
const core = new THREE.Mesh(new THREE.SphereGeometry(0.55, 28, 18), mGlow);
core.position.y = 1.55;
body.add(core);

// Inner mechanical rings
for (let i = 0; i < 4; i++) {
  const r = new THREE.Mesh(new THREE.TorusGeometry(0.75 + i*0.12, 0.022, 8, 36), mLight);
  r.position.y = 1.4 + i*0.12;
  r.rotation.x = Math.PI/2;
  body.add(r);
}

// Eye
const eye = new THREE.Group();
eye.position.set(0, 1.75, 1.42);
body.add(eye);

const eyeFrame = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.055, 12, 28), mLight);
eye.add(eyeFrame);

const blades = [];
for (let i = 0; i < 14; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.038, 0.02), mMid);
  b.position.x = 0.12;
  const p = new THREE.Group();
  p.add(b);
  p.rotation.z = (i/14)*Math.PI*2;
  eye.add(p);
  blades.push(p);
}

const lens = new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 14), new THREE.MeshPhysicalMaterial({
  color: 0x112244, metalness: 0.5, roughness: 0.08, transmission: 0.5, emissive: 0x001833
}));
lens.position.z = -0.06;
eye.add(lens);

// Arms - more detailed
const arms = [];
for (let i = 0; i < 8; i++) {
  const ag = new THREE.Group();
  const ang = (i / 8) * Math.PI * 2;
  ag.position.set(Math.cos(ang)*1.22, -0.05, Math.sin(ang)*1.22);
  ag.rotation.y = -ang + Math.PI/2;
  ag.userData.ang = ang;
  root.add(ag);
  arms.push(ag);

  let prev = ag;
  const N = 18;
  for (let s = 0; s < N; s++) {
    const t = s / N;
    const len = 0.48 - t * 0.18;
    const rad = 0.2 - t * 0.11;
    const j = new THREE.Group();
    j.position.y = s === 0 ? -0.12 : -len * 0.92;

    const cyl = new THREE.Mesh(
      new THREE.CylinderGeometry(rad*0.82, rad, len, 14),
      (s % 4 === 0) ? mLight : mMid
    );
    cyl.position.y = -len/2;
    j.add(cyl);

    if (s > 0) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(rad*1.08, 0.014, 6, 14), mCopper);
      ring.rotation.x = Math.PI/2;
      j.add(ring);
    }

    // Suckers denser
    if (s > 0 && s < N-1) {
      for (let side = -1; side <= 1; side += 2) {
        const su = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), mSucker);
        su.scale.set(1, 0.32, 1);
        su.position.set(side * rad * 0.7, -len * 0.3, 0);
        j.add(su);
      }
    }

    prev.add(j);
    prev = j;
  }

  // Initial curl
  let n = ag.children[0];
  let d = 0;
  while (n && d < 8) {
    if (n.rotation) n.rotation.x = 0.18 + d * 0.035;
    n = n.children[0];
    d++;
  }
}

// Floor
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 72),
  new THREE.MeshStandardMaterial({ color: 0x08080c, roughness: 0.98 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -2.0;
scene.add(floor);

// State
let exploded = false, irisOpen = false, domeUp = false;
let t = 0;

const btnE = document.getElementById('btnExplode');
const btnI = document.getElementById('btnIris');
const btnD = document.getElementById('btnDome');
const bgInput = document.getElementById('bgColor');

function syncBtns() {
  btnE.classList.toggle('active', exploded);
  btnE.textContent = exploded ? 'Assemble' : 'Explode';
  btnI.classList.toggle('active', irisOpen);
  btnD.classList.toggle('active', domeUp);
}

btnE.onclick = () => { exploded = !exploded; syncBtns(); };
btnI.onclick = () => { irisOpen = !irisOpen; syncBtns(); };
btnD.onclick = () => { domeUp = !domeUp; syncBtns(); };

bgInput.oninput = (e) => {
  const c = new THREE.Color(e.target.value);
  scene.background = c;
  scene.fog.color = c;
  document.body.style.background = e.target.value;
};

function animate() {
  requestAnimationFrame(animate);
  t += 0.016;
  controls.update();

  root.rotation.y = Math.sin(t * 0.22) * 0.06;

  arms.forEach((arm, i) => {
    const ph = t * 0.55 + i * 0.75;
    let node = arm.children[0];
    let d = 0;
    while (node && d < 12) {
      if (node.rotation) {
        const base = exploded ? 0.02 : (0.14 + d * 0.028);
        node.rotation.x = base + Math.sin(ph + d * 0.3) * 0.07;
      }
      node = node.children[0];
      d++;
    }
  });

  arms.forEach(arm => {
    const a = arm.userData.ang;
    const r = exploded ? 4.0 : 1.22;
    arm.position.x = THREE.MathUtils.lerp(arm.position.x, Math.cos(a)*r, 0.045);
    arm.position.z = THREE.MathUtils.lerp(arm.position.z, Math.sin(a)*r, 0.045);
    arm.position.y = THREE.MathUtils.lerp(arm.position.y, exploded ? 0.6 : -0.05, 0.045);
  });

  dome.position.y = THREE.MathUtils.lerp(dome.position.y, domeUp ? 3.6 : 1.72, 0.04);
  dome.rotation.y = domeUp ? t * 0.35 : 0;

  blades.forEach(p => {
    const o = irisOpen ? 0.38 : 0;
    p.children[0].position.x = THREE.MathUtils.lerp(p.children[0].position.x, 0.12 + o, 0.06);
  });

  coreLight.intensity = 1.8 + Math.sin(t * 2.2) * 0.5;
  core.material.emissiveIntensity = 0.9 + Math.sin(t * 2.2) * 0.4;

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
